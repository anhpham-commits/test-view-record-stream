<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leanbot Farm Stream Viewer</title>
</head>

<body>

<div class="container">
    <div class="viewer">

        <div class="toolbar">

            <input
                id="RemoteLeanbot"
                type="text"
                placeholder="896692"
                value="896692"
            >

            <button id="btnConnect">
                Connect
            </button>

            <button id="btnRecordStart" disabled>
                Start Record
            </button>

            <button id="btnRecordStop" disabled>
                Stop Record
            </button>

            <button id="statsButton" disabled title="Stream Stats">
                <svg class="stats-icon" viewBox="0 0 512 512">
                    <path d="M256 8C119.043 8 8 119.083 8 256c0 136.997 111.043 248 248 248s248-111.003 248-248C504 119.083 392.957 8 256 8zm0 110c23.196 0 42 18.804 42 42s-18.804 42-42 42-42-18.804-42-42 18.804-42 42-42zm56 254c0 6.627-5.373 12-12 12h-88c-6.627 0-12-5.373-12-12v-24c0-6.627 5.373-12 12-12h12v-64h-12c-6.627 0-12-5.373-12-12v-24c0-6.627 5.373-12 12-12h64c6.627 0 12 5.373 12 12v100h12c6.627 0 12 5.373 12 12v24z"/>
                </svg>
            </button>

        </div>

        <div id="video" class="run-video"></div>

    </div>
</div>

</body>
</html>
